name: Bug report / 问题反馈
description: Report a reproducible problem without private logs.
body:
  - type: markdown
    attributes:
      value: "Use English or Chinese. Do not attach APKs, raw logs, account details, private URLs or keys. / 请勿上传 APK、原始日志、账号、私有链接或密钥。"
  - type: input
    id: version
    attributes:
      label: Project and Apple TV app versions / 项目与 App 版本
      description: Include versionCode and whether the input is original.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, Android version and ABI / 设备、系统与架构
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile and feature flags / 配置与功能开关
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected/actual result / 复现与预期、实际结果
      description: Include whether this is a physical test or a support request.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏摘要
      description: Relevant counters and doctor/inspect summary only; no full logs or playback URLs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I reviewed this report and removed APKs, credentials, private URLs and raw logs.
          required: true
