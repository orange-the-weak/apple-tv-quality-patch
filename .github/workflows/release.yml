name: Prepare release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0)
        required: true
        type: string
      include_hud:
        description: Attach own HUD signed with the configured stable release key
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Validate selected version and tag
        run: |
          python3 - <<'PYCODE'
          import os
          from atvpatch import __version__
          assert os.environ['RELEASE_TAG'] == 'v'+__version__, 'Tag/version mismatch'
          PYCODE
          python3 scripts/release.py --require-tag
      - run: bash scripts/test.sh
      - run: python3 scripts/verify_release.py "dist/apple-tv-quality-patch-${RELEASE_TAG#v}-source.zip"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        if: ${{ inputs.include_hud }}
      - name: Install HUD build dependencies
        if: ${{ inputs.include_hud }}
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build own HUD with stable signing identity
        if: ${{ inputs.include_hud }}
        env:
          HUD_KEY_B64: ${{ secrets.HUD_RELEASE_KEYSTORE_B64 }}
          ATV_KEYSTORE_PASSWORD: ${{ secrets.HUD_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          key=$(mktemp "$RUNNER_TEMP/hud-release.XXXXXX")
          trap 'rm -f "$key"' EXIT
          export HUD_KEY_PATH="$key"
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          assert os.environ['HUD_KEY_B64'] and os.environ['ATV_KEYSTORE_PASSWORD'], 'Release signing secrets are required'
          Path(os.environ['HUD_KEY_PATH']).write_bytes(base64.b64decode(os.environ['HUD_KEY_B64'],validate=True))
          PYCODE
          chmod 600 "$key"
          python3 -m atvpatch hud --keystore "$key" --output build/release-hud
          cp build/release-hud/PlaybackPanel.apk "dist/PlaybackPanel-${RELEASE_TAG#v}.apk"
          sha256sum "dist/PlaybackPanel-${RELEASE_TAG#v}.apk" > "dist/PlaybackPanel-${RELEASE_TAG#v}.apk.sha256"
      - name: Create preview draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --draft --prerelease --verify-tag             --title "$RELEASE_TAG public preview" --notes-file "docs/releases/$RELEASE_TAG.md" dist/*
