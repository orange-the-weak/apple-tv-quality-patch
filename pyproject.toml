[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-tv-quality-patch"
dynamic = ["version"]
description = "Local, version-pinned Android TV playback quality patch and diagnostic HUD"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["atvpatch*"]

[tool.setuptools.package-data]
atvpatch = ["payloads/*.js", "adapters/*.json", "profiles/*.json"]

[tool.setuptools.dynamic]
version = {attr = "atvpatch.__version__"}
